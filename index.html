<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roof Log">
<title>Roof Repair Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#E9EDEF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#E9EDEF; --surface:#FFFFFF; --ink:#15232A; --muted:#5A6A72; --line:#C9D2D6;
  --accent:#F2C200; --accent-ink:#1A1A00; --blue:#1D5E8A; --blue-soft:#E1ECF4;
  --extra:#7A3FA8; --extra-soft:#F1E8F8; --danger:#B3261E; --ok:#2F7A3B;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10181C; --surface:#1A252B; --ink:#E5ECEE; --muted:#93A4AB; --line:#2E3C43;
    --blue:#7DB6DE; --blue-soft:#1C3242; --extra:#C9A0EA; --extra-soft:#2E2238; --danger:#F08A82; --ok:#7CC58A;
  }
}
:root[data-theme="dark"]{
  --bg:#10181C; --surface:#1A252B; --ink:#E5ECEE; --muted:#93A4AB; --line:#2E3C43;
  --blue:#7DB6DE; --blue-soft:#1C3242; --extra:#C9A0EA; --extra-soft:#2E2238; --danger:#F08A82; --ok:#7CC58A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 96px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.bar .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.back{border:0;background:none;font-weight:600;color:var(--blue);padding:8px 4px;font-size:17px;cursor:pointer}
.bar h1{font-family:var(--cond);font-weight:700;font-size:22px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved{font-size:14px;color:var(--muted)}
.hero{padding:18px 0 8px}
.hero .parish{font-family:var(--cond);font-weight:800;font-size:clamp(44px,9vw,76px);line-height:.95;letter-spacing:-.01em;margin:0}
.hero .sub{color:var(--muted);margin-top:6px}
h2{font-family:var(--cond);font-weight:700;font-size:24px;margin:26px 0 10px}
h3{font-size:17px;margin:18px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.row .t{font-weight:600}
.row .m{color:var(--muted);font-size:15px}
.row .grow{flex:1;min-width:0}
.chev{color:var(--muted);font-size:22px}
.badge{font-size:13px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.badge.sent{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.badge.draft{background:var(--blue-soft);color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.btn:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible,.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;margin:14px 0}
.seg button{flex:1;min-height:44px;border:0;border-radius:7px;background:none;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
label.f{display:block;margin:12px 0}
label.f span{display:block;font-size:15px;font-weight:600;color:var(--muted);margin-bottom:5px}
input.in,select.in,textarea.in{width:100%;min-height:50px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.gps{display:flex;gap:10px;align-items:stretch}
.gps input{flex:1}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.err{color:var(--danger)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;cursor:pointer}
.ph .n{position:absolute;left:6px;bottom:4px;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 2px #000}
.add{aspect-ratio:1;border:2px dashed var(--line);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--blue);font-weight:600;cursor:pointer;background:var(--surface);text-align:center;font-size:15px;padding:6px}
.add b{font-size:30px;line-height:1}
.add input{display:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:14px;color:var(--muted);font-weight:600}
td.u{color:var(--muted);font-size:14px;text-align:left}
.xcol{color:var(--extra)}
.low{color:var(--danger);font-weight:700}
.mat td{padding:6px 8px}
.mat input{width:78px;min-height:44px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px}
.mat input.x{border-color:color-mix(in srgb,var(--extra) 45%,var(--line));background:var(--extra-soft)}
.mat .nm{font-weight:600}
.mat .oh{display:block;font-size:13px;color:var(--muted);font-weight:400}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.note{background:var(--blue-soft);border-radius:10px;padding:12px 14px;font-size:15px;margin:12px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw;text-align:center}
.rep h4{margin:18px 0 6px;font-size:16px}
.rep .kv{color:var(--muted);font-size:15px}
@media print{header.bar,.seg,.btns,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>
<body>
<header class="bar"><div class="in" id="bar"></div></header>
<main class="wrap" id="app"><div class="empty">Loading…</div></main>
<script>
(function(){
"use strict";
const PARISHES=["Kingston","St. Andrew","St. Thomas","Portland","St. Mary","St. Ann","Trelawny","St. James","Hanover","Westmoreland","St. Elizabeth","Manchester","Clarendon","St. Catherine"];
const MATS=[
 {k:"zinc",n:"12' Roof zinc",u:"sheets"},{k:"ridge",n:"8' Ridge capping",u:"each"},
 {k:"drip",n:'10" Drip edge',u:"each"},{k:"strap",n:"Hurricane strap",u:"each"},
 {k:"b2x4",n:"2x4x12",u:"pieces"},{k:"b1x4",n:"1x4x12",u:"pieces"},
 {k:"h3",n:'H3 1½" nails',u:"lbs"},{k:"w2",n:'2" wire',u:"lbs"},{k:"w3",n:'3" wire',u:"lbs"},
 {k:"w4",n:'4" wire',u:"lbs"},{k:"head",n:'2½" head nails',u:"lbs"},{k:"screw",n:'2½" zinc screws',u:"each"},
 {k:"fillet",n:"Wood fillets",u:"each"},{k:"wframe",n:"Window frame",u:"each"},
 {k:"wblade",n:"Window blade",u:"each"},{k:"door",n:"Doors",u:"each"},{k:"verandah",n:"Verandah",u:"each"}
];
const HOUSE_TYPES=["Board","Block","Board & block","Other"];

/* ---------- storage (IndexedDB, on this device only) ---------- */
let idb=null; const mem={records:new Map()};
function openDB(){return new Promise((res)=>{
  try{const r=indexedDB.open("roof-log",1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("records",{keyPath:"id"});d.createObjectStore("photos");};
    r.onsuccess=()=>{idb=r.result;res();};r.onerror=()=>res();
  }catch(e){res();}
});}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  if(!idb){res(null);return;}
  try{const t=idb.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);
    t.oncomplete=()=>res(out&&out.result!==undefined?out.result:null);t.onerror=()=>rej(t.error);
  }catch(e){rej(e);}
});}
async function loadAll(){
  if(!idb)return;
  const all=await new Promise((res)=>{try{const q=idb.transaction("records").objectStore("records").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);}catch(e){res([]);}});
  all.forEach(r=>mem.records.set(r.id,r));
}
async function save(r){mem.records.set(r.id,r);try{await tx("records","readwrite",s=>s.put(r));flashSaved();}catch(e){toast("Couldn't save. Storage may be full.");}}
async function remove(id){mem.records.delete(id);try{await tx("records","readwrite",s=>s.delete(id));}catch(e){}}
const photoMem=new Map();
async function putPhoto(id,blob){photoMem.set(id,blob);try{await tx("photos","readwrite",s=>s.put(blob,id));}catch(e){toast("Couldn't store photo. Storage may be full.");}}
async function getPhoto(id){if(photoMem.has(id))return photoMem.get(id);
  if(!idb)return null;
  const b=await new Promise((res)=>{try{const q=idb.transaction("photos").objectStore("photos").get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});
  if(b)photoMem.set(id,b);return b;}
async function delPhoto(id){photoMem.delete(id);if(urlCache.has(id)){URL.revokeObjectURL(urlCache.get(id));urlCache.delete(id);}try{await tx("photos","readwrite",s=>s.delete(id));}catch(e){}}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const recs=t=>[...mem.records.values()].filter(r=>r.type===t);
const projects=()=>recs("project").sort((a,b)=>b.created-a.created);
const loadsOf=pid=>recs("load").filter(l=>l.pid===pid).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);
const housesOf=pid=>recs("house").filter(h=>h.pid===pid).sort((a,b)=>a.created-b.created);
const matsOf=p=>MATS.concat(p.custom||[]);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const fmt=n=>{const r=Math.round(n*100)/100;return String(r);};
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const niceDate=s=>{if(!s)return"";const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});};

function totals(p){
  const t={};matsOf(p).forEach(m=>t[m.k]={loaded:0,used:0,extra:0});
  loadsOf(p.id).forEach(l=>Object.entries(l.qty||{}).forEach(([k,v])=>{if(t[k])t[k].loaded+=num(v);}));
  housesOf(p.id).forEach(hs=>{
    Object.entries(hs.used||{}).forEach(([k,v])=>{if(t[k])t[k].used+=num(v);});
    Object.entries(hs.extra||{}).forEach(([k,v])=>{if(t[k])t[k].extra+=num(v);});
  });
  Object.values(t).forEach(x=>x.onhand=x.loaded-x.used-x.extra);
  return t;
}

/* ---------- UI helpers ---------- */
let savedTimer;function flashSaved(){const el=document.getElementById("savedLbl");if(!el)return;el.textContent="Saved";clearTimeout(savedTimer);savedTimer=setTimeout(()=>{if(el)el.textContent="";},1500);}
let toastTimer;function toast(msg){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2800);}
const urlCache=new Map();
async function photoURL(id){if(urlCache.has(id))return urlCache.get(id);const b=await getPhoto(id);if(!b)return"";const u=URL.createObjectURL(b);urlCache.set(id,u);return u;}

async function shrink(file){
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const max=2400;let w=img.naturalWidth,ht=img.naturalHeight;const sc=Math.min(1,max/Math.max(w,ht));
    w=Math.round(w*sc);ht=Math.round(ht*sc);
    const c=document.createElement("canvas");c.width=w;c.height=ht;c.getContext("2d").drawImage(img,0,0,w,ht);
    URL.revokeObjectURL(url);
    const b=await new Promise(res=>c.toBlob(res,"image/jpeg",0.88));
    return b||file;
  }catch(e){return file;}
}

/* ---------- navigation ---------- */
let stack=[{v:"home"}];
const cur=()=>stack[stack.length-1];
function go(s){stack.push(s);render();window.scrollTo(0,0);}
function back(){if(stack.length>1)stack.pop();render();window.scrollTo(0,0);}

function setBar(title,showBack){
  document.getElementById("bar").innerHTML=(showBack?'<button class="back" data-a="back" aria-label="Back">‹ Back</button>':'')+'<h1>'+h(title)+'</h1><span class="saved" id="savedLbl" aria-live="polite"></span>';
}

/* ---------- views ---------- */
function render(){
  const s=cur();const app=document.getElementById("app");
  if(s.v==="home")return viewHome(app);
  const p=mem.records.get(s.pid);if(!p){stack=[{v:"home"}];return viewHome(app);}
  if(s.v==="project")return viewProject(app,p,s);
  if(s.v==="load")return viewLoad(app,p,s);
  if(s.v==="house")return viewHouse(app,p,s);
}

function viewHome(app){
  setBar("Roof Repair Log",false);
  const ps=projects();
  app.innerHTML=
   '<section class="hero"><p class="parish">Projects</p><p class="sub">One project per trip out. Each holds all the houses you do in that parish.</p></section>'+
   '<div class="card" style="padding:4px 16px 16px"><h2 style="margin-top:14px">Start a new project</h2>'+
   '<div class="grid2"><label class="f"><span>Parish</span><select class="in" id="np-parish">'+PARISHES.map(x=>'<option>'+x+'</option>').join("")+'</select></label>'+
   '<label class="f"><span>Start date</span><input class="in" type="date" id="np-date" value="'+today()+'"></label></div>'+
   '<label class="f"><span>Field officer (optional)</span><input class="in" id="np-officer" autocomplete="off"></label>'+
   '<h3>Load from container</h3><p class="hint" style="margin-top:0">Enter what you take this morning. Leave blank anything you don\u2019t load.</p>'+
   '<div class="scroll" style="margin-top:8px"><table class="mat"><thead><tr><th>Material</th><th>Loaded</th></tr></thead><tbody>'+
   MATS.map(m=>'<tr><td><span class="nm">'+h(m.n)+'</span><span class="oh">'+h(m.u)+'</span></td><td><input type="number" inputmode="decimal" min="0" step="any" data-np="'+m.k+'" aria-label="'+h(m.n)+' loaded"></td></tr>').join("")+
   '</tbody></table></div>'+
   '<button class="btn primary block" style="margin-top:14px" data-a="newProject">Start project</button></div>'+
   '<h2>Your projects</h2>'+
   (ps.length?'<ul class="list card">'+ps.map(p=>{const n=housesOf(p.id).length;return '<li><button class="row" data-a="openProject" data-id="'+p.id+'"><span class="grow"><span class="t">'+h(p.parish)+'</span><br><span class="m">Started '+h(niceDate(p.date))+' · '+n+' house'+(n===1?'':'s')+'</span></span><span class="chev">›</span></button></li>';}).join("")+'</ul>'
     :'<div class="card empty">No projects yet. Start one above when you head out.</div>')+
   extrasAllHTML(ps)+
   '<h2>Backup</h2><div class="card" style="padding:14px 16px">'+
   '<p style="margin:0 0 4px">Saves every project, house, material and photo as one file. Keep it in Files or iCloud Drive.</p>'+
   '<p class="hint" style="margin:0">Last backup: '+h(lastBackup())+'</p>'+
   '<div class="btns"><button class="btn blue" data-a="backup">Back up now</button>'+
   '<label class="btn">Restore from backup<input type="file" accept=".zip,application/zip" data-restore="1" style="display:none"></label></div>'+
   '<p class="hint" style="margin:0">Restoring adds the backup\u2019s projects back in. Anything already on the tablet stays.</p></div>'+
   '<p class="hint">Everything is stored only on this tablet.</p>';
}

function extrasAllHTML(ps){
  if(!ps.length)return"";
  const all={};const per=[];
  ps.forEach(p=>{const t=totals(p);const row={p,items:{}};
    matsOf(p).forEach(m=>{const e=t[m.k].extra;if(e){const key=m.n+"|"+m.u;all[key]=(all[key]||0)+e;row.items[key]=e;}});
    if(Object.keys(row.items).length)per.push(row);});
  const keys=Object.keys(all);
  if(!keys.length)return '<h2>Extras across all projects</h2><div class="card empty">No extras recorded yet.</div>';
  return '<h2>Extras across all projects</h2><div class="card scroll"><table><thead><tr><th>Material</th><th>Unit</th>'+
    per.map(r=>'<th>'+h(r.p.parish)+'<br><span style="font-weight:400">'+h(niceDate(r.p.date))+'</span></th>').join("")+
    '<th class="xcol">Total</th></tr></thead><tbody>'+
    keys.map(k=>{const [n,u]=k.split("|");return '<tr><td>'+h(n)+'</td><td class="u">'+h(u)+'</td>'+per.map(r=>'<td>'+(r.items[k]?fmt(r.items[k]):'–')+'</td>').join("")+'<td class="xcol"><b>'+fmt(all[k])+'</b></td></tr>';}).join("")+
    '</tbody></table></div><p class="hint">Adds up the Extra column from every house in every project.</p>';
}

function viewProject(app,p,s){
  setBar(p.parish,true);
  const tab=s.tab||"houses";
  const hs=housesOf(p.id);
  let body="";
  if(tab==="houses"){
    body='<div class="btns" style="margin-top:0"><button class="btn primary" style="flex:2" data-a="newHouse">Add house</button><button class="btn" style="flex:1" data-a="newLoad">Load from container</button></div>'+
     (hs.length?'<ul class="list card" style="margin-top:14px">'+hs.slice().reverse().map(x=>'<li><button class="row" data-a="openHouse" data-id="'+x.id+'"><span class="grow"><span class="t">'+h(x.name||"Unnamed recipient")+'</span><br><span class="m">'+h(x.address||"No address yet")+'</span></span>'+(x.sentAt?'<span class="badge sent">Sent</span>':'<span class="badge draft">Not sent</span>')+'<span class="chev">›</span></button></li>').join("")+'</ul>'
      :'<div class="card empty" style="margin-top:14px">No houses yet. Add one when you reach a recipient.</div>');
  }else if(tab==="stock"){
    const t=totals(p);const ls=loadsOf(p.id);
    body='<div class="btns"><button class="btn primary" data-a="newLoad">Add load from container</button><button class="btn" data-a="addMat">Add other material</button></div>'+
     '<div class="card scroll"><table><thead><tr><th>Material</th><th>Unit</th><th>Loaded</th><th>Used</th><th class="xcol">Extra</th><th>On hand</th></tr></thead><tbody>'+
     matsOf(p).map(m=>{const x=t[m.k];return '<tr><td>'+h(m.n)+'</td><td class="u">'+h(m.u)+'</td><td>'+fmt(x.loaded)+'</td><td>'+fmt(x.used)+'</td><td class="xcol">'+fmt(x.extra)+'</td><td class="'+(x.onhand<0?'low':'')+'">'+fmt(x.onhand)+'</td></tr>';}).join("")+
     '</tbody></table></div>'+
     '<h2>Loads</h2>'+
     (ls.length?'<ul class="list card">'+ls.map((l,i)=>{const items=Object.entries(l.qty||{}).filter(([,v])=>num(v)>0).length;return '<li><button class="row" data-a="openLoad" data-id="'+l.id+'"><span class="grow"><span class="t">Load '+(i+1)+'</span><br><span class="m">'+h(niceDate(l.date))+' · '+items+' item'+(items===1?'':'s')+'</span></span><span class="chev">›</span></button></li>';}).join("")+'</ul>'

const TESS="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
const ID_STOP=/\b(JAMAICA|JAMAICAN|GOVERNMENT|DRIVER|DRIVERS|DRIVER'S|LICEN[CS]E|PERMIT|NATIONAL|IDENTIFICATION|IDENTITY|CARD|ELECTORAL|OFFICE|VOTER|VOTERS|REGISTRATION|REPUBLIC|PASSPORT|TAX|TAXPAYER|TRN|ADDRESS|CLASS|SEX|DATE|BIRTH|EXPIRY|EXPIRES|ISSUE|ISSUED|SIGNATURE|HOLDER|NATIONALITY|COUNTRY|TYPE|CODE|AUTHORITY|ISLAND|TRAFFIC|COLLECTORATE|PARISH|KINGSTON|ANDREW|CATHERINE|CLARENDON|MANCHESTER|ELIZABETH|WESTMORELAND|HANOVER|JAMES|TRELAWNY|ANN|MARY|PORTLAND|THOMAS|HEIGHT|EYES|MALE|FEMALE|DONOR|RESTRICTIONS|ORIGINAL|DUPLICATE|NO|NUMBER)\b/i;
const titleCase=s=>s.toLowerCase().replace(/\b([a-z])/g,c=>c.toUpperCase()).replace(/\s+/g," ").trim();
function nameCandidates(text){
  const out=[];const add=n=>{n=titleCase(n.replace(/[^A-Za-z' -]/g," "));if(n.split(" ").filter(w=>w.length>1).length>=2&&!out.includes(n))out.push(n);};
  const raw=text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  // Passport machine-readable line: P<JAMSURNAME<<GIVEN<NAMES
  raw.forEach(l=>{const m=l.replace(/\s/g,"").toUpperCase().match(/^P[<A-Z0-9][A-Z<]{3}([A-Z<]+<<[A-Z<]+)/);
    if(m){const [sur,giv]=m[1].split("<<");if(sur&&giv)add(giv.replace(/</g," ")+" "+sur.replace(/</g," "));}});
  // Labelled fields
  let sur="",giv="";
  raw.forEach((l,i)=>{
    const val=()=>{const after=l.split(/[:\-]/).slice(1).join(" ").trim();return after||raw[i+1]||"";};
    if(/\b(SURNAME|LAST\s*NAME|FAMILY\s*NAME)\b/i.test(l))sur=sur||val();
    else if(/\b(FIRST\s*NAME|GIVEN\s*NAMES?|FORENAMES?|CHRISTIAN\s*NAMES?)\b/i.test(l))giv=giv||val();
    else if(/^\s*NAME\b/i.test(l))add(val());
  });
  const clean=v=>v.replace(/[^A-Za-z' -]/g," ").replace(ID_STOP," ").trim();
  if(sur&&giv)add(clean(giv)+" "+clean(sur));
  // Fallback: lines that look like a name
  raw.forEach(l=>{const c=l.replace(/[^A-Za-z' -]/g," ").replace(/\s+/g," ").trim();
    const w=c.split(" ").filter(x=>x.length>1);
    if(w.length>=2&&w.length<=4&&!ID_STOP.test(c)&&!/\b(NAMES?|SURNAME|FIRST|GIVEN|LAST|ST|STREET|ROAD|RD|LANE|AVENUE|AVE|DISTRICT|P\.?O|BOX)\b/i.test(c)&&c.length>=5&&c===c.toUpperCase())add(c);});
  return out.slice(0,4);
}
async function readIDName(x){
  const box=document.getElementById("ocrBox");if(!box)return;
  const blob=x.photos.id&&await getPhoto(x.photos.id);if(!blob){box.textContent="Add the ID photo first.";return;}
  box.className="hint";box.textContent="Reading the ID… (the first time needs signal and takes a little longer)";
  try{
    await loadScript(TESS);
    const r=await Tesseract.recognize(blob,"eng");
    const c=nameCandidates(r.data.text||"");
    if(!document.getElementById("ocrBox"))return;
    if(!c.length){box.className="hint err";box.textContent="Couldn't find a name. Retake the ID photo flat with no glare, or tap the name box and use Scan Text.";return;}
    box.innerHTML='Tap the right name:<div class="btns" style="margin:8px 0 0">'+c.map(n=>'<button class="btn" data-a="useName" data-id="'+h(n)+'">'+h(n)+'</button>').join("")+'</div>';
  }catch(e){box.className="hint err";box.textContent="Couldn't read the ID here. Check you have signal for the first use, or tap the name box and use Scan Text.";}
}
async function sendHouse(x){
  const ids=[].concat(x.photos.id?[["ID",x.photos.id]]:[],x.photos.before.map((id,i)=>["BEFORE_"+(i+1),id]),x.photos.after.map((id,i)=>["AFTER_"+(i+1),id]));
  const files=[];for(const [n,id] of ids){const b=await getPhoto(id);if(b)files.push(new File([b],n+".jpg",{type:"image/jpeg"}));}
  if(!files.length){toast("No photos to send.");return;}
  let shared=false;
  if(navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({files});shared=true;}catch(e){if(e&&e.name==="AbortError")return;}
  }
  if(!shared){
    if(!window.JSZip){toast("Sharing isn't available here. Open this page in Safari.");return;}
    toast("Sharing photos directly isn't available here. Saving them as one zip instead.");
    const z=new JSZip();files.forEach(f=>z.file(f.name,f));
    const blob=await z.generateAsync({type:"blob"});
    shared=await offerFile(((x.name||"house").replace(/[^\w]+/g,"_"))+".zip",blob);
    if(!shared)return;
  }
  if(confirm("Mark this house as sent?")){x.sentAt=Date.now();await save(x);render();}
}

function markDirty(){}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a;const id=b.dataset.id;
  if(a==="back")return back();
  if(a==="newProject"){
    const p={id:uid(),type:"project",parish:document.getElementById("np-parish").value,date:document.getElementById("np-date").value||today(),officer:document.getElementById("np-officer").value.trim(),custom:[],created:Date.now()};
    await save(p);
    const qty={};document.querySelectorAll("[data-np]").forEach(i=>{const v=num(i.value);if(v>0)qty[i.dataset.np]=v;});
    if(Object.keys(qty).length)await save({id:uid(),type:"load",pid:p.id,date:p.date,qty,created:Date.now()});
    return go({v:"project",pid:p.id,tab:"houses"});
  }
  if(a==="backup"){b.disabled=true;try{await doBackup();}catch(err){toast("Backup failed. Check the tablet has free space.");}b.disabled=false;return;}
  if(a==="openProject")return go({v:"project",pid:id,tab:"houses"});
  if(a==="tab"){cur().tab=id;return render();}
  const p=curProject();
  if(a==="editProject"&&p){
    const par=prompt("Parish",p.parish);if(par===null)return;
    const off=prompt("Field officer (optional)",p.officer||"");if(off===null)return;
    p.parish=par.trim()||p.parish;p.officer=off.trim();await save(p);return render();
  }
  if(a==="delProject"&&p){
    if(!confirm("Delete the "+p.parish+" project, all its houses, loads and photos? This can't be undone."))return;
    for(const x of housesOf(p.id)){for(const pid of [x.photos.id,...x.photos.before,...x.photos.after].filter(Boolean))await delPhoto(pid);await remove(x.id);}
    for(const l of loadsOf(p.id))await remove(l.id);
    await remove(p.id);stack=[{v:"home"}];return render();
  }
  if(a==="newLoad"&&p){const l={id:uid(),type:"load",pid:p.id,date:today(),qty:{},created:Date.now()};await save(l);return go({v:"load",pid:p.id,lid:l.id});}
  if(a==="openLoad"&&p)return go({v:"load",pid:p.id,lid:id});
  if(a==="saveLoad"){const l=curLoad();if(l){clearTimeout(saveT);await save(l);toast("\u2713 Load saved");back();}return;}
  if(a==="delLoad"){const l=curLoad();if(l&&confirm("Delete this load?")){await remove(l.id);back();}return;}
  if(a==="addMat"&&p){
    const n=prompt("Material name (e.g. Verandah post)");if(!n||!n.trim())return;
    const u=prompt("Unit (each, pieces, lbs, sheets…)","each");if(u===null)return;
    p.custom=p.custom||[];p.custom.push({k:"c_"+uid(),n:n.trim(),u:(u.trim()||"each")});await save(p);return render();
  }
  if(a==="newHouse"&&p){const x={id:uid(),type:"house",pid:p.id,name:"",address:"",phone:"",houseType:"",gps:"",used:{},extra:{},photos:{id:null,before:[],after:[]},created:Date.now()};await save(x);return go({v:"house",pid:p.id,hid:x.id});}
  if(a==="openHouse"&&p)return go({v:"house",pid:p.id,hid:id});
  const x=curHouse();
  if(a==="gps"&&x){
    const msg=document.getElementById("gpsMsg");
    if(!navigator.geolocation){msg.textContent="GPS isn't available here. Type the coordinates.";msg.className="hint err";return;}
    msg.textContent="Getting location…";msg.className="hint";b.disabled=true;
    navigator.geolocation.getCurrentPosition(async pos=>{
      x.gps=pos.coords.latitude.toFixed(6)+", "+pos.coords.longitude.toFixed(6);await save(x);
      const inp=document.querySelector('[data-f="gps"]');if(inp)inp.value=x.gps;
      msg.textContent="Accurate to about "+Math.round(pos.coords.accuracy)+" m.";b.disabled=false;
    },err=>{msg.textContent=err.code===1?"Location is blocked. On the iPad go to Settings \u2192 Apps \u2192 Safari \u2192 Location and choose Allow, and check Settings \u2192 Privacy & Security \u2192 Location Services \u2192 Safari Websites is set to While Using the App. Then close and reopen this app. You can also type the coordinates.":"Couldn't get a fix. Step outside and try again, or type the coordinates.";msg.className="hint err";b.disabled=false;},
    {enableHighAccuracy:true,timeout:20000,maximumAge:0});
    return;
  }
  if(a==="rmPhoto"&&x){
    if(!confirm("Remove this photo?"))return;
    const slot=b.dataset.slot;if(slot==="id")x.photos.id=null;else x.photos[slot]=x.photos[slot].filter(q=>q!==id);
    await delPhoto(id);await save(x);return render();
  }
  if(a==="send"&&x)return sendHouse(x);
  if(a==="ocr"&&x){b.disabled=true;await readIDName(x);b.disabled=false;return;}
  if(a==="useName"&&x){x.name=id;await save(x);const inp=document.querySelector('[data-f="name"]');if(inp)inp.value=id;setTitle(id);const bx=document.getElementById("ocrBox");if(bx){bx.className="hint";bx.textContent="\u2713 Name filled in: "+id;}return;}
  if(a==="saveHouse"&&x){clearTimeout(saveT);await save(x);toast("\u2713 House saved");return;}
  if(a==="unsend"&&x){x.sentAt=null;await save(x);return render();}
  if(a==="clearPhotos"&&x){
    if(!confirm("Delete all photos for this house from the tablet? The details and materials stay."))return;
    for(const pid of [x.photos.id,...x.photos.before,...x.photos.after].filter(Boolean))await delPhoto(pid);
    x.photos={id:null,before:[],after:[]};await save(x);return render();
  }
  if(a==="delHouse"&&x){
    if(!confirm("Delete this house and its photos?"))return;
    for(const pid of [x.photos.id,...x.photos.before,...x.photos.after].filter(Boolean))await delPhoto(pid);
    await remove(x.id);return back();
  }
  if(a==="shareReport"&&p){
    const text=reportText(p);
    try{if(navigator.share){await navigator.share({title:"Report – "+p.parish,text});return;}}catch(err){if(err&&err.name==="AbortError")return;}
    try{await navigator.clipboard.writeText(text);toast("Report copied. Paste it into WhatsApp.");}catch(err){toast("Sharing isn't available here.");}
    return;
  }
  if(a==="saveCSV"&&p){await offerFile("Report_"+p.parish.replace(/[^\w]+/g,"_")+"_"+p.date+".csv",new Blob(["\ufeff"+reportCSV(p)],{type:"text/csv"}));return;}
  if(a==="pdf"&&p){b.disabled=true;try{await makePDF(p);}catch(err){toast("Couldn't make the PDF. Check you have signal the first time, then try again.");}b.disabled=false;return;}
});

let saveT;
document.addEventListener("input",e=>{
  const el=e.target;const x=curHouse();const l=curLoad();
  const rec=x||l;if(!rec)return;
  if(el.dataset.f){rec[el.dataset.f]=el.value;if(x&&el.dataset.f==="name")setTitle(el.value||"New house");}
  else if(el.dataset.u&&x){x.used[el.dataset.u]=num(el.value);}
  else if(el.dataset.x&&x){x.extra[el.dataset.x]=num(el.value);}
  else if(el.dataset.q&&l){l.qty[el.dataset.q]=num(el.value);}
  else return;
  clearTimeout(saveT);saveT=setTimeout(()=>save(rec),400);
});
function setTitle(t){const e=document.querySelector(".bar h1");if(e)e.textContent=t;const hp=document.querySelector(".hero .parish");if(hp&&cur().v==="house")hp.textContent=t;}
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.dataset.restore){const f=el.files[0];el.value="";if(f){try{await doRestore(f);}catch(err){toast("Restore failed.");}}return;}
  if(el.matches("select[data-f]")){const x=curHouse();if(x){x[el.dataset.f]=el.value;await save(x);}return;}
  if(el.type==="file"&&el.dataset.slot){
    const x=curHouse();if(!x||!el.files.length)return;
    const slot=el.dataset.slot;toast("Adding photo"+(el.files.length>1?"s":"")+"…");
    for(const f of [...el.files]){
      const blob=await shrink(f);const pid=uid();await putPhoto(pid,blob);
      if(slot==="id"){if(x.photos.id)await delPhoto(x.photos.id);x.photos.id=pid;}else x.photos[slot].push(pid);
    }
    await save(x);render();
    if(slot==="id"&&!x.name)readIDName(x);
  }
});
